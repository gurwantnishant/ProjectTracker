<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flowspace — Project Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%235B5FEF%22/><text x=%2250%22 y=%2266%22 font-size=%2255%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22800%22>F</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar__brand">
        <div class="sidebar__brand-mark">F</div>
        <span class="sidebar__brand-label">Flowspace</span>
      </div>
      <nav id="sidebarNav"></nav>
      <div class="sidebar__spacer"></div>
      <button class="sidebar__collapse-btn" id="sidebarCollapseBtn">⟨⟩ <span class="sidebar__section-label">Collapse</span></button>
    </aside>

    <div>
      <header class="topbar">
        <button class="icon-btn" id="mobileNavBtn" style="display:none;">☰</button>
        <div class="topbar__title" id="topbarTitle">Dashboard</div>
        <div class="search-box">
          <span class="search-box__icon">🔎</span>
          <input type="text" id="globalSearchInput" placeholder="Search projects, tasks, owners...  (press /)">
          <div class="search-results" id="searchResults" style="display:none;"></div>
        </div>
        <div class="topbar__spacer"></div>
        <button class="icon-btn" id="notifBellBtn" aria-label="Notifications">
          🔔
          <span class="icon-btn__badge" id="notifBadge" style="display:none;"></span>
        </button>
      </header>
      <main class="main" id="mainContent"></main>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div id="toastHost"></div>

  <script src="js/firebase-config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/sample-data.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/milestones.js"></script>
  <script src="js/portfolios.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/projects.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/gantt.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
