<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projectly — Project Tracker</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar__brand">
        <img class="sidebar__brand-mark" src="assets/logo-icon.png" alt="Projectly logo">
        <span class="sidebar__brand-label">Projectly</span>
      </div>
      <nav id="sidebarNav"></nav>
      <div class="sidebar__spacer"></div>
      <button class="sidebar__collapse-btn" id="sidebarCollapseBtn">⟨⟩ <span class="sidebar__section-label">Collapse</span></button>
    </aside>

    <div>
      <header class="topbar">
        <button class="icon-btn" id="mobileNavBtn" style="display:none;">☰</button>
        <div class="topbar__title" id="topbarTitle">Dashboard</div>
        <div class="search-box">
          <span class="search-box__icon">🔎</span>
          <input type="text" id="globalSearchInput" placeholder="Search projects, tasks, owners...  (press /)">
          <div class="search-results" id="searchResults" style="display:none;"></div>
        </div>
        <div class="topbar__spacer"></div>
        <div class="project-select-wrap" id="topbarProjectSelectWrap">
          <select class="project-select project-select--topbar" id="topbarProjectSelect">
            <option value="all">📊 All Projects</option>
          </select>
        </div>
        <button class="icon-btn" id="notifBellBtn" aria-label="Notifications">
          🔔
          <span class="icon-btn__badge" id="notifBadge" style="display:none;"></span>
        </button>
      </header>
      <main class="main" id="mainContent"></main>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div id="toastHost"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.11.0/mammoth.browser.min.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/topdown.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/scheduling.js"></script>
  <script src="js/sample-data.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/milestones.js"></script>
  <script src="js/portfolios.js"></script>
  <script src="js/workforce-capacity.js"></script>
  <script src="js/workforce.js"></script>
  <script src="js/emailExport.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/import.js"></script>
  <script src="js/projects.js"></script>
  <script src="js/gantt.js"></script>
  <script src="js/audit.js"></script>
  <script src="js/ridac.js"></script>
  <script src="js/workspace.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
